name: dgtl_app
description: "DGTL - Medical-Grade Healthcare Platform for Android Demonstration"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.8
  
  # Networking & HTTP - Real-time Communication
  http: ^1.2.1
  
