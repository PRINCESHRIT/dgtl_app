name: dgtl_app
description: "DGTL - AI-powered Chronic Kidney Disease management app with offline RAG pipeline"

publish_to: 'none' # Private app

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Database & Storage
  flutter_secure_storage: ^9.0.0
  drift: ^2.13.0
  sqlite3_flutter_libs: ^0.5.0
  sqlcipher_flutter_libs: ^0.5.5
  path_provider: ^2.1.0
  
  # AI & ML
  tflite_flutter: ^0.11.0
  vector_math: ^2.1.4
  
  # State Management & Dependency Injection
  provider: ^6.1.0
  get_it: ^7.6.4
  
  # Utilities
  uuid: ^4.1.0
  crypto: ^3.0.3
  
  # UI Components
  cupertino_icons: ^1.0.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  flutter_lints: ^3.0.0
  build_runner: ^2.4.7
  drift_dev: ^2.13.0

flutter:
  uses-material-design: true
  
  # Add assets folder for AI models (when ready)
  assets:
    - assets/models/
  
  # Font configuration (optional)
  # fonts:
  #   - family: Roboto
  #     fonts:
  #       - asset: fonts/Roboto-Regular.ttf
  #       - asset: fonts/Roboto-Bold.ttf
  #         weight: 700
