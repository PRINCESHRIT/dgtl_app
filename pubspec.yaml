name: dgtl_app
description: "DGTL - Privacy-First Nephrology AI Assistant with On-Device RAG"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  
  # Database & Storage
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.1
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  
  # AI & ML - Compatible versions
  # tflite_flutter: ^0.10.1  # Temporarily commented out due to compatibility issues
  
  # Networking & HTTP
  http: ^1.2.1
  dio: ^5.4.0
  
  # Utility & Security
  crypto: ^3.0.3
  uuid: ^4.3.3
  intl: ^0.19.0
  
  # State Management & Dependency Injection
  provider: ^6.1.1
  riverpod: ^2.4.9
  flutter_riverpod: ^2.4.9
  get_it: ^7.6.4
  
  # UI & Design
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  fl_chart: ^0.68.0
  
  # File Handling
  # file_picker: ^6.1.1  # Commented out due to v1 embedding compatibility issues
  share_plus: ^7.2.1
  
  # Medical Data Processing
  collection: ^1.18.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation
  drift_dev: ^2.15.0
  build_runner: ^2.4.8

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/
    - assets/illustrations/
    
  # Using Google Fonts package for Roboto font instead of local files
