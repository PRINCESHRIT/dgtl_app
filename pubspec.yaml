name: dgtl_app
description: "DGTL - Medical-Grade Healthcare Platform with Offline Sync & Real-time Updates"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2

dependencies:
  flutter:
    sdk: flutter
  
  # UI & Navigation
  cupertino_icons: ^1.0.8
  go_router: ^14.2.0
  
  # Database & Storage - Production Ready
  drift: ^2.15.0
  sqlite3_flutter_libs: ^0.5.0
  path_provider: ^2.1.1
  path: ^1.9.0
  flutter_secure_storage: ^9.0.0
  
  # Networking & WebSocket - Real-time Communication
  http: ^1.2.1
  dio: ^5.4.0
  web_socket_channel: ^2.4.0
  retrofit: ^4.1.0
  
  # State Management - Production Architecture
  flutter_riverpod: ^2.4.9
  riverpod_annotation: ^2.3.3
  
  # Connectivity & Background Tasks
  connectivity_plus: ^5.0.2
  # workmanager: ^0.5.1  # Temporarily disabled
  
  # Utility & Security
  crypto: ^3.0.3
  uuid: ^4.3.3
  intl: ^0.19.0
  get_it: ^8.0.0
  
  # UI & Design - Medical Interface
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  flutter_animate: ^4.2.0
  fl_chart: ^0.68.0
  
  # Development & Testing
  json_annotation: ^4.8.1
  share_plus: ^7.2.1
  
  # Medical Data Processing
  collection: ^1.18.0
  
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  
  # Code Generation - Production Database
  drift_dev: ^2.15.0
  build_runner: ^2.4.8
  riverpod_generator: ^2.3.9
  json_serializable: ^6.7.1
  retrofit_generator: ^8.1.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/models/
    - assets/illustrations/
    - assets/images/
    
  # Using Google Fonts package for medical-grade typography
