name: flutter_svg_demo
description: A Flutter demo app showcasing SVG assets for medical UI components.

publish_to: 'none' # Remove this line if you wish to publish to pub.dev

version: 1.0.0+1

environment:
  sdk: '>=3.1.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_svg: ^2.1.1  # use latest version available

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  uses-material-design: true
  
  assets:
    - assets/svgs/online-medical-consultation-male-svgrepo-com.svg
    - assets/svgs/medical-examination-male-svgrepo-com.svg
    - assets/svgs/male-doctor-to-guide-svgrepo-com.svg
    - assets/svgs/heart-svgrepo-com.svg
    - assets/svgs/kidney-svgrepo-com.svg
    - assets/svgs/happy-2-svgrepo-com.svg
